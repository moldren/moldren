name: Generate snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: moldren
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23FF9BD2&color_dots=%23ebedf0,%23ffd6ec,%23ffb3d9,%23ff8ec7,%23ff69b4
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%23FF69B4&color_dots=%23ebedf0,%23ffd6ec,%23ffb3d9,%23ff8ec7,%23ff69b4

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
